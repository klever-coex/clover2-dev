[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clover2-dev"
version = "0.1.0"
description = "Plugin-based developer CLI for clover2 projects"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "semver>=3.0",
    "lxml>=5.0",
    "gitpython>=3.1",
    "minio>=7.2",
    "tomlkit>=0.13",
]

[project.scripts]
clover2-dev = "clover2_dev.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["clover2_dev"]

[project.entry-points."clover2_dev.plugins"]
version = "clover2_dev.plugins.version:plugin"
minio = "clover2_dev.plugins.minio:plugin"
