name: clover2-dev
description: Install the clover2-dev CLI

branding:
  icon: terminal
  color: green

inputs:
  python-version:
    description: Python version
    required: false
    default: "3.12"

outputs:
  version:
    description: Installed clover2-dev CLI version
    value: ${{ steps.install.outputs.version }}

runs:
  using: composite
  steps:
    - name: Set up uv + Python
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install clover2-dev CLI
      id: install
      shell: bash
      run: |
        set -euo pipefail
        uv tool install --force "${{ github.action_path }}/tooling"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

        version="$("$HOME/.local/bin/clover2-dev" --version | awk '{print $NF}')"
        echo "version=${version}" >> "$GITHUB_OUTPUT"
        echo "Installed clover2-dev ${version}"
