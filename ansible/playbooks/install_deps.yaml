- name: Install dependencies
  hosts: "{{ target | default('local') }}"
  vars_files:
    - vars/ros_packages_profiles.yaml
  vars:
    gz_version: "harmonic"

  pre_tasks:
    - name: Resolve ROS packages profile
      ansible.builtin.import_tasks: tasks/resolve_ros_packages_profile.yaml
      tags: always

  roles:
    - role: clover2.dev.ros2
      tags: [core, simulation]

    - role: clover2.dev.px4_deps
      tags: [simulation]

    - role: clover2.dev.geographiclib
      tags: [core, simulation, geographiclib]

    - role: clover2.dev.ros2_extra
      tags: [core, simulation]

    - role: clover2.dev.mavros
      tags: [core, simulation]

    - role: clover2.dev.ros2_dev_tools
      tags: [dev, core, simulation]

    - role: clover2.dev.gz
      tags: [simulation]
