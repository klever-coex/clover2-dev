name: Docker Build and Push

on:
  push:
    tags: ['v*']
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect-mode:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      build_mode: ${{ steps.version.outputs.build_mode }}
      git_hash: ${{ steps.version.outputs.git_hash }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/version-detect
        id: version

  docker:
    needs: detect-mode
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: base
            needs-source: false
          - target: core-devel
            needs-source: true
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/docker-bake
        with:
          target: ${{ matrix.target }}
          needs-source: ${{ matrix.needs-source }}
          build-mode: ${{ needs.detect-mode.outputs.build_mode }}
          git-hash: ${{ needs.detect-mode.outputs.git_hash }}
          version: ${{ needs.detect-mode.outputs.version }}
          push: ${{ github.event_name != 'pull_request' }}
