name: Action self-test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  self-test:
    name: Install CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install via action
        uses: ./

      - name: CLI is on PATH
        run: |
          set -euo pipefail
          command -v clover2-dev
          clover2-dev --version

      - name: Plugins registered and config discovery works
        run: |
          set -euo pipefail
          clover2-dev plugins list
          clover2-dev version show --main-only
