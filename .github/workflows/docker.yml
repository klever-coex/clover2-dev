name: Docker Build and Push

on:
  push:
    branches: [master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      build_mode: ${{ steps.detect.outputs.build_mode }}
      git_hash: ${{ steps.detect.outputs.git_hash }}
      version: ${{ steps.detect.outputs.version }}
    steps:
      - name: Detect build mode
        id: detect
        shell: bash
        run: |
          case "${{ github.ref }}" in
            refs/heads/master)
              echo "build_mode=master" >> "$GITHUB_OUTPUT"
              ;;
            refs/tags/*)
              echo "build_mode=release" >> "$GITHUB_OUTPUT"
              echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "build_mode=develop" >> "$GITHUB_OUTPUT"
              ;;
          esac
          HASH="${{ github.sha }}"
          echo "git_hash=${HASH:0:7}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include: 
          - runs-on: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
          - runs-on: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
      packages: write
      actions: write
    steps:
      - uses: actions/checkout@v5

      - name: Build ${{ matrix.platform }}
        id: build
        uses: ./.github/actions/docker-build
        with:
          ghcr-token: ${{ secrets.GITHUB_TOKEN }}
          bake-target: default
          build-mode: ${{ needs.prepare.outputs.build_mode }}
          git-hash: ${{ needs.prepare.outputs.git_hash }}
          version: ${{ needs.prepare.outputs.version }}
          platform: ${{ matrix.platform }}
          push-by-digest: true

      - name: Export image digests
        shell: bash
        env:
          BUILD_METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          set -euo pipefail

          digest_dir="$RUNNER_TEMP/digests/${{ matrix.arch }}"
          mkdir -p "$digest_dir"

          while IFS=$'\t' read -r target digest; do
            printf '%s\n' "$digest" > "$digest_dir/$target"
          done < <(
            jq -r '
              to_entries[]
              | select(.value["containerimage.digest"] != null)
              | [.key, .value["containerimage.digest"]]
              | @tsv
            ' <<< "$BUILD_METADATA"
          )

      - name: Upload image digests
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/docker-setup
        with:
          ghcr-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download image digests
        uses: actions/download-artifact@v8
        with:
          pattern: digests-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Create multi-platform manifests
        shell: bash
        env:
          BUILD_MODE: ${{ needs.prepare.outputs.build_mode }}
          CLOVER2_DEV_GIT_HASH: ${{ needs.prepare.outputs.git_hash }}
          CLOVER2_DEV_VERSION: ${{ needs.prepare.outputs.version }}
          PUSH_BY_DIGEST: false
          USE_REGISTRY_CONTEXTS: false
        run: |
          set -euo pipefail

          bake_definition="$(docker buildx bake \
            --file docker/docker-bake.hcl \
            --print default)"

          for amd64_digest_file in "$RUNNER_TEMP"/digests/amd64/*; do
            target="$(basename "$amd64_digest_file")"
            arm64_digest_file="$RUNNER_TEMP/digests/arm64/$target"

            if [[ ! -f "$arm64_digest_file" ]]; then
              echo "Missing arm64 digest for target $target" >&2
              exit 1
            fi

            mapfile -t tags < <(
              jq -r --arg target "$target" \
                '.target[$target].tags[]' <<< "$bake_definition"
            )

            if (( ${#tags[@]} == 0 )); then
              echo "No tags found for target $target" >&2
              exit 1
            fi

            repository="ghcr.io/klever-coex/clover2-dev"
            tag_args=()
            for tag in "${tags[@]}"; do
              tag_args+=(--tag "$tag")
            done

            docker buildx imagetools create \
              "${tag_args[@]}" \
              "$repository@$(<"$amd64_digest_file")" \
              "$repository@$(<"$arm64_digest_file")"

            docker buildx imagetools inspect "${tags[0]}"
          done
