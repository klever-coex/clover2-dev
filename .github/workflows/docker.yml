name: Docker Build and Push

on:
  push:
    branches: [master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      build_mode: ${{ steps.detect.outputs.build_mode }}
      git_hash: ${{ steps.detect.outputs.git_hash }}
      version: ${{ steps.detect.outputs.version }}
    steps:
      - name: Detect build mode
        id: detect
        shell: bash
        run: |
          case "${{ github.ref }}" in
            refs/heads/master)
              echo "build_mode=master" >> "$GITHUB_OUTPUT"
              ;;
            refs/tags/*)
              echo "build_mode=release" >> "$GITHUB_OUTPUT"
              echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "build_mode=develop" >> "$GITHUB_OUTPUT"
              ;;
          esac
          HASH="${{ github.sha }}"
          echo "git_hash=${HASH:0:7}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include: 
          - runs-on: ubuntu-24.04
            platform: linux/amd64
          - runs-on: ubuntu-24.04-arm64
            platform: linux/arm64
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
      packages: write
      actions: write
    steps:
      - uses: actions/checkout@v5

      - name: Build ${{ matrix.platform }}
        id: build
        uses: ./.github/actions/docker-build
        with:
          ghcr-token: ${{ secrets.GH_PAT }}
          bake-target: default
          build-mode: ${{ needs.prepare.outputs.build_mode }}
          git-hash: ${{ needs.prepare.outputs.git_hash }}
          version: ${{ needs.prepare.outputs.version }}
          platform: ${{ matrix.platform }}
          push-by-digest: true
